spring.application.name=CadastroDeNinjas

# H2 Database (file-based) - portable and suitable for local Docker
spring.datasource.url=jdbc:h2:file:./data/ninjadb;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Flyway to avoid external DB migrations conflicts
spring.flyway.enabled=false

